spring:
  application:
    name: mcp
  main:
    banner-mode: off

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: my-mcp-server
        version: 0.0.1
        annotation-scanner: true
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: ${MCP_SERVER_PORT}

notion:
  api:
    token: ${NOTION_API_TOKEN:}
    data-source-id: ${NOTION_DATA_SOURCE_ID:}
    version: ${NOTION_API_VERSION:2025-09-03}

telegram:
  api:
    token: ${TELEGRAM_API_TOKEN}
    url:  ${TELEGRAM_API_URL}
    channel: ${TELEGRAM_CHANNEL_ID}






logging:
  pattern:
    console:
